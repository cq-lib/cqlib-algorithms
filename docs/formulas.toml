# Display and inline formulas rendered into docs/assets/formulas/.
# All entries use one mathematical font size and generated baselines.

[[formula]]
name = "ae-state-decomposition"
latex = 'A|0\rangle=\sqrt{1-a}\,|\psi_{\mathrm{bad}}\rangle+\sqrt{a}\,|\psi_{\mathrm{good}}\rangle,\qquad a=\sin^2\theta,\quad \theta\in\left[0,\frac{\pi}{2}\right]'
alt = "A|0⟩ = √(1-a)|ψ_bad⟩ + √a|ψ_good⟩, where a = sin²θ and θ is in [0, π/2]."
references = ["docs/user-guide/algorithms/amplitude-estimation.md"]

[[formula]]
name = "ae-controlled-power"
latex = 'U=\operatorname{matrix}(Q),\qquad U_p=U^{2^j},\qquad C_p=\operatorname{diag}(I,U_p)'
alt = "U is the matrix of Q, U_p = U^(2^j), and C_p = diag(I, U_p)."
references = ["docs/user-guide/algorithms/amplitude-estimation.md"]

[[formula]]
name = "ae-grid-estimate"
latex = '\widehat{a}=\sin^2\left(\frac{\pi x}{2^m}\right)'
alt = "The amplitude estimate is sin²(πx/2^m)."
references = ["docs/user-guide/algorithms/amplitude-estimation.md"]

[[formula]]
name = "iae-round-bound"
latex = 'T=\left\lceil\log_2\left(\frac{\pi}{8\epsilon}\right)\right\rceil'
alt = "T equals the ceiling of log base 2 of π divided by 8ε."
references = ["docs/user-guide/algorithms/amplitude-estimation.md"]

[[formula]]
name = "iae-amplitude-radius"
latex = '\epsilon_a=\sqrt{\frac{\log(2T/\alpha)}{2N_{\mathrm{total}}}}'
alt = "ε_a equals the square root of log(2T/α) divided by 2N_total."
references = ["docs/user-guide/algorithms/amplitude-estimation.md"]

[[formula]]
name = "iae-angle-bound"
latex = 'L_{\max}=\arcsin\left(\left(\frac{2\log(2T/\alpha)}{N_{\mathrm{shots}}}\right)^{1/4}\right)'
alt = "L_max is the arcsine of the fourth root of 2 log(2T/α) divided by N_shots."
references = ["docs/user-guide/algorithms/amplitude-estimation.md"]

[[formula]]
name = "mlae-log-likelihood"
latex = '\sum_k\left[h_k\log\left(\sin^2((2k+1)\theta)\right)+(N-h_k)\log\left(\cos^2((2k+1)\theta)\right)\right]'
alt = "Maximum-likelihood amplitude-estimation log-likelihood over experiment powers k."
references = ["docs/user-guide/algorithms/amplitude-estimation.md"]

[[formula]]
name = "fae-shot-bounds"
latex = '\left\lceil1944\log\left(\frac{2}{\delta_c}\right)\right\rceil,\qquad\left\lceil972\log\left(\frac{2}{\delta_c}\right)\right\rceil'
alt = "The two FAE shot bounds are ceil(1944 log(2/δ_c)) and ceil(972 log(2/δ_c))."
references = ["docs/user-guide/algorithms/amplitude-estimation.md"]

[[formula]]
name = "bb84-diagonal-basis"
latex = '0\mapsto|+\rangle=\frac{|0\rangle+|1\rangle}{\sqrt{2}},\qquad 1\mapsto|-\rangle=\frac{|0\rangle-|1\rangle}{\sqrt{2}}'
alt = "In the BB84 diagonal basis, 0 maps to |+⟩ and 1 maps to |−⟩."
references = ["docs/user-guide/algorithms/bb84.md"]

[[formula]]
name = "bell-state"
latex = '|\Phi^+\rangle=\frac{|00\rangle+|11\rangle}{\sqrt{2}}'
alt = "The Bell state |Φ+⟩ equals (|00⟩ + |11⟩)/√2."
references = [
    "docs/user-guide/algorithms/chsh.md",
    "docs/user-guide/algorithms/quantum-teleportation.md",
    "docs/user-guide/algorithms/superdense-coding.md",
]

[[formula]]
