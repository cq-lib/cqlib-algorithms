latex = '\widetilde{\mathcal{X}}=\{x\mid x\sim\widetilde{P}_{\Psi}(x)\},\qquad x\in\{0,1\}^{M}'
alt = "The SQD sampled configuration set contains bit strings drawn from the mitigated state distribution."
references = ["docs/user-guide/algorithms/sample-based-quantum-diagonalization.md"]

[[formula]]
name = "sqd-projected-hamiltonian"
latex = 'H_{\mathcal{S}^{(k)}}=P_{\mathcal{S}^{(k)}}HP_{\mathcal{S}^{(k)}},\qquad P_{\mathcal{S}^{(k)}}=\sum_{x\in\mathcal{S}^{(k)}}|x\rangle\langle x|'
alt = "The SQD subspace Hamiltonian and its projector onto sampled configurations."
references = ["docs/user-guide/algorithms/sample-based-quantum-diagonalization.md"]

[[formula]]
name = "sqd-orbital-occupation"
latex = 'n_{p\sigma}=\frac{1}{K}\sum_{k=1}^{K}\langle\psi^{(k)}|\widehat{n}_{p\sigma}|\psi^{(k)}\rangle'
alt = "The orbital occupation is averaged over K reconstructed SQD states."
references = ["docs/user-guide/algorithms/sample-based-quantum-diagonalization.md"]

[[formula]]
name = "sampling-vqe-energy"
latex = '\widehat{E}=\frac{1}{N}\sum_x n_xC(x)'
alt = "The sampled energy is the count-weighted average of the diagonal cost C(x)."
references = ["docs/user-guide/algorithms/sampling-vqe.md"]

[[formula]]
name = "var-qite-state"
latex = '|\psi(\tau)\rangle=\frac{e^{-\tau H}|\psi(0)\rangle}{\|e^{-\tau H}|\psi(0)\rangle\|}'
alt = "The normalized imaginary-time evolved state."
references = ["docs/user-guide/algorithms/var-qite.md"]

[[formula]]
name = "var-qite-metric"
latex = 'g_{ij}=\operatorname{Re}\left[\langle\partial_i\psi|\partial_j\psi\rangle-\langle\partial_i\psi|\psi\rangle\langle\psi|\partial_j\psi\rangle\right]'
alt = "The phase-invariant projected quantum-geometric metric used by VarQITE."
references = ["docs/user-guide/algorithms/var-qite.md"]

[[formula]]
name = "var-qite-update"
latex = 'g\dot{\theta}=-\frac{1}{2}\nabla_\theta\langle\psi(\theta)|H|\psi(\theta)\rangle'
alt = "The VarQITE parameter-velocity equation."
references = ["docs/user-guide/algorithms/var-qite.md"]

[[formula]]
name = "var-qrte-metric"
latex = 'G_{ij}=\langle\partial_i\psi|\partial_j\psi\rangle-\langle\partial_i\psi|\psi\rangle\langle\psi|\partial_j\psi\rangle'
alt = "The projected quantum-geometric tensor used by VarQRTE."
references = ["docs/user-guide/algorithms/var-qrte.md"]

[[formula]]
name = "var-qrte-force"
latex = 'b_i=\operatorname{Im}\left[\langle\partial_i\psi|H|\psi\rangle-\langle\partial_i\psi|\psi\rangle\langle\psi|H|\psi\rangle\right]'
alt = "The imaginary projected force vector used by VarQRTE."
references = ["docs/user-guide/algorithms/var-qrte.md"]

[[formula]]
name = "vqd-objective"
latex = 'L_s(\theta)=\langle\psi(\theta)|H|\psi(\theta)\rangle+\sum_{j=0}^{s-1}\beta_j|\langle\psi_j|\psi(\theta)\rangle|^2'
alt = "The VQD objective adds overlap penalties for previously found states."
references = ["docs/user-guide/algorithms/vqd.md"]

[[formula]]
