[[formula]]
name = "deutsch-jozsa-zero-amplitude"
latex = '\frac{1}{2^n}\sum_x(-1)^{f(x)}'
alt = "The all-zero output amplitude is 2^−n times the sum over x of (−1)^f(x)."
references = ["docs/user-guide/algorithms/deutsch-jozsa.md"]

[[formula]]
name = "hpe-phase-rescaling"
latex = '\widetilde{\phi}=\phi\;(\phi<1/2),\quad\widetilde{\phi}=\phi-1\;(\phi\geq1/2),\qquad\lambda=\frac{2\pi\widetilde{\phi}}{s}'
alt = "The phase is mapped to a signed interval before the eigenvalue λ = 2πφ̃/s is recovered."
references = ["docs/user-guide/algorithms/phase-estimation.md"]

[[formula]]
name = "qaoa-layered-state"
