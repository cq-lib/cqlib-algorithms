alt = "The CHSH measurement settings are a = (0, π/2) and b = (π/4, −π/4)."
references = ["docs/user-guide/algorithms/chsh.md"]

[[formula]]
name = "chsh-correlator-expansion"
latex = 'M_A(a)\otimes M_B(b)=\cos(a)\cos(b)Z_AZ_B+\cos(a)\sin(b)Z_AX_B+\sin(a)\cos(b)X_AZ_B+\sin(a)\sin(b)X_AX_B'
