[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cqlib-algorithms"
version = "0.1.0.dev0"
description = "Composable quantum algorithm components for Cqlib."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
requires-python = ">=3.11"
dependencies = [
    "cqlib>=2.0.0b7,<2.1",
    "numpy>=2.1.0",
    "scipy>=1.14,<2",
]

classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
chemistry = ["pyscf>=2.6,<3"]
machine-learning = ["scikit-learn>=1.4,<2"]

[dependency-groups]
dev = [
    "build>=1.2.2,<2",
    "mypy>=1.17,<2",
    "pytest>=8.3,<10",
    "ruff>=0.12,<1",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/cqlib_algorithms"]

[tool.ruff]
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["src/cqlib_algorithms"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/pyproject.toml", "/README.md", "/LICENSE.txt"]

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
pythonpath = ["cqlib/src", "tests/operators/arithmetic"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
markers = [
    "integration: tests covering interactions between components",
    "reference: correctness checks against independent reference implementations",
    "slow: tests unsuitable for the default short development cycle",
]
